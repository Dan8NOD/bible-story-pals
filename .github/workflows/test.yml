name: Play-through test

on:
  pull_request:
  push:
    # Torah Story Pals lives on its own branch and is pushed to directly, so test it there too.
    branches: [main, feat/torah-version]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tests/play-through.mjs --shots shots
      - run: node tests/regressions.mjs
      - run: node tests/voices.test.mjs
      - run: node tests/native.test.mjs
      - run: node tests/unlocks.test.mjs
      - run: node tests/prayers.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
