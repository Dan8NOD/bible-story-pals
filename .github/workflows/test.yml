name: Play-through test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tests/play-through.mjs --shots shots
      - run: node tests/regressions.mjs
      - run: node tests/voices.test.mjs
      - run: node tests/native.test.mjs
      - run: node tests/android.test.mjs
      - run: node tests/unlocks.test.mjs
      - run: node tests/prayers.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/

  # Compiles the Android app with the JDK that Capacitor 8 asks for and runs the Google Play
  # receipt checks. No signing key and no Play licensing key are involved.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run android
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
        working-directory: android
