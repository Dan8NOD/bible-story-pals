apply plugin: 'com.android.application'

// The upload key for Google Play never lives in this repo: GitHub Pages publishes all of it.
// A release build is signed only when a properties file outside the repo says where the key is.
// Without that file the bundle comes out unsigned. docs/google-play.md has the steps.
def keystoreProps = new Properties()
def keystorePropsFile = file(System.getenv('BSP_KEYSTORE_PROPERTIES') ?: "${System.getProperty('user.home')}/.bible-story-pals/keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasUploadKey = keystoreProps.getProperty('storeFile') != null

// The Play licensing key switches the shop on. It is the public half of the key Google signs
// purchases with (Play Console: Monetize with Play, Monetization setup, Licensing), so it may be
// committed: paste it into android/app/play-licensing-key.txt, or set BSP_PLAY_LICENSING_KEY.
// Without it the app can't verify a purchase, so the build sells nothing and locks nothing.
def licensingKeyFile = file('play-licensing-key.txt')
def playLicensingKey = (System.getenv('BSP_PLAY_LICENSING_KEY') ?: (licensingKeyFile.exists() ? licensingKeyFile.text : '')).replaceAll(/\s/, '')
if (!(playLicensingKey ==~ /[A-Za-z0-9+\/=]*/)) {
    throw new GradleException('The Play licensing key is not base64. Copy it again from Play Console.')
}

android {
    namespace = "com.dancruz.biblestorypals"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dancruz.biblestorypals"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.0"
        buildConfigField 'String', 'PLAY_LICENSING_KEY', "\"${playLicensingKey}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        release {
            if (hasUploadKey) {
                // A bare file name means the key sits next to the properties file.
                def keyFile = new File(keystoreProps.getProperty('storeFile'))
                storeFile keyFile.isAbsolute() ? keyFile : new File(keystorePropsFile.parentFile, keyFile.path)
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword') ?: keystoreProps.getProperty('storePassword')
            }
        }
    }
    buildTypes {
        release {
            if (hasUploadKey) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Google Play Billing, for the story and prayer unlocks (UnlocksPlugin.java).
    implementation 'com.android.billingclient:billing:8.3.0'
    // Android's own org.json is only a stub on the JVM the unit tests run on.
    testImplementation 'org.json:json:20240303'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
